<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuel</title>
<style>
  :root {
    --stroke: rgba(255,255,255,0.35);
    --text: #ffffff;
    --muted: rgba(255,255,255,0.68);
    --pro: #5ac8fa;
    --carb: #ffd60a;
    --fat: #bf5af2;
    --good: #30d158;
    --over: #ff453a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    background: #0b1020;
    padding: max(env(safe-area-inset-top), 20px) 16px 110px;
    overflow-x: hidden;
  }
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .75; }
  .b1 { width: 340px; height: 340px; background: #ff6a3d; top: -80px; left: -90px; animation: drift1 18s ease-in-out infinite alternate; }
  .b2 { width: 380px; height: 380px; background: #3a6bff; top: 260px; right: -140px; animation: drift2 22s ease-in-out infinite alternate; }
  .b3 { width: 320px; height: 320px; background: #b13cff; bottom: -100px; left: -60px; animation: drift3 20s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(80px, 120px); } }
  @keyframes drift2 { to { transform: translate(-90px, -80px); } }
  @keyframes drift3 { to { transform: translate(110px, -90px); } }

  .wrap { max-width: 520px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: flex-end; margin: 8px 4px 18px; }
  header h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.8px; }
  header .date { color: var(--muted); font-size: 15px; font-weight: 500; }

  .glass {
    background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.07));
    border: 1px solid var(--stroke);
    border-radius: 30px;
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    box-shadow: 0 10px 40px rgba(0,0,0,0.28), inset 0 1.5px 0 rgba(255,255,255,0.55), inset 0 -1px 0 rgba(255,255,255,0.08);
    position: relative; overflow: hidden;
  }
  .glass::before {
    content: ""; position: absolute; top: -60%; left: -30%; width: 90%; height: 120%;
    background: radial-gradient(closest-side, rgba(255,255,255,0.22), transparent);
    transform: rotate(-20deg); pointer-events: none;
  }
  .card { padding: 22px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 14px; font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 600; }

  /* ring */
  .ring-wrap { display: flex; align-items: center; justify-content: center; position: relative; padding: 6px 0 4px; }
  svg.ring { width: 250px; height: 250px; transform: rotate(-90deg); overflow: visible; }
  .ring .track { fill: none; stroke: rgba(255,255,255,0.14); stroke-width: 22; }
  .ring .prog { fill: none; stroke-width: 22; stroke-linecap: round; transition: stroke-dashoffset 1.4s cubic-bezier(.2,.9,.2,1); filter: drop-shadow(0 0 12px rgba(255,122,89,.6)); }
  .ring-center { position: absolute; text-align: center; }
  .ring-center .big { font-size: 58px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
  .ring-center .sub { color: var(--muted); font-size: 14px; margin-top: 6px; font-weight: 500; }
  .ring-center .eaten { font-size: 13px; color: var(--muted); margin-top: 10px; }

  .stats { display: flex; justify-content: space-around; margin-top: 14px; }
  .stat { text-align: center; }
  .stat b { font-size: 20px; display: block; }
  .stat span { font-size: 12px; color: var(--muted); }

  /* macros */
  .macro { margin-bottom: 16px; }
  .macro:last-child { margin-bottom: 0; }
  .macro .row { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; margin-bottom: 7px; }
  .macro .row span:last-child { color: var(--muted); font-weight: 500; }
  .bar { height: 12px; background: rgba(255,255,255,0.14); border-radius: 99px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.25); }
  .bar i { display: block; height: 100%; border-radius: 99px; width: 0; transition: width 1.2s cubic-bezier(.2,.9,.2,1); }

  .quip { display: flex; gap: 12px; align-items: flex-start; font-size: 16px; line-height: 1.4; font-weight: 500; }
  .quip .spark { font-size: 22px; }

  /* week chart: fixed pixel geometry so bars and goal line always line up */
  .week { display: flex; align-items: flex-end; justify-content: space-between; height: 160px; position: relative; padding-top: 10px; }
  .goal-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed rgba(255,255,255,0.55); pointer-events: none; }
  .goal-line em { position: absolute; right: 0; top: -18px; font-size: 11px; color: var(--muted); font-style: normal; }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .col .b { width: 26px; border-radius: 10px 10px 6px 6px; transition: height 1s cubic-bezier(.2,.9,.2,1); height: 0; }
  .col .lbl { height: 22px; line-height: 22px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .col .lbl.today { color: #fff; font-weight: 700; }
  .week-avg { margin-top: 14px; font-size: 14px; color: var(--muted); text-align: center; }
  .week-avg b { color: #fff; }

  /* calendar */
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cal-head h2 { margin: 0; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .dow { text-align: center; font-size: 11px; color: var(--muted); font-weight: 600; }
  .day { aspect-ratio: 1; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; background: rgba(255,255,255,0.06); position: relative; }
  .day.under { background: rgba(48,209,88,0.38); box-shadow: inset 0 0 0 1px rgba(48,209,88,.7); }
  .day.over  { background: rgba(255,69,58,0.42); box-shadow: inset 0 0 0 1px rgba(255,69,58,.8); }
  .day.today { outline: 2px solid #fff; outline-offset: 1px; }
  .day.future { opacity: .35; }

  /* meals */
  .meal { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.12); }
  .meal:last-child { border: 0; }
  .meal .n { font-size: 15px; font-weight: 600; }
  .meal .t { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .meal .k { font-weight: 700; font-size: 15px; white-space: nowrap; margin-left: 12px; }

  nav {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: max(env(safe-area-inset-bottom), 16px);
    display: flex; gap: 6px; padding: 8px; border-radius: 99px; z-index: 10;
    background: linear-gradient(135deg, rgba(255,255,255,0.26), rgba(255,255,255,0.10));
    border: 1px solid var(--stroke);
    backdrop-filter: blur(30px) saturate(190%); -webkit-backdrop-filter: blur(30px) saturate(190%);
    box-shadow: 0 12px 36px rgba(0,0,0,0.4), inset 0 1.5px 0 rgba(255,255,255,0.6);
  }
  nav button { background: none; border: 0; color: var(--muted); font: 600 14px -apple-system, sans-serif; padding: 11px 20px; border-radius: 99px; cursor: pointer; transition: all .25s; }
  nav button.on { background: rgba(255,255,255,0.28); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 2px 10px rgba(0,0,0,.2); }
  .page { display: none; } .page.on { display: block; animation: fade .45s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: none; } }
  .note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="wrap">
  <header>
    <h1>Fuel</h1>
    <div class="date" id="dateLabel"></div>
  </header>

  <section class="page on" id="p-today">
    <div class="glass card">
      <h2>Calories</h2>
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 200 200">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffb199"/><stop offset="100%" stop-color="#ff5e3a"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="100" cy="100" r="82"/>
          <circle class="prog" id="prog" cx="100" cy="100" r="82" stroke="url(#g)"/>
        </svg>
        <div class="ring-center">
          <div class="big" id="left">0</div>
          <div class="sub" id="leftLbl">left today</div>
          <div class="eaten" id="eaten"></div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><b id="sGoal">1,850</b><span>Goal</span></div>
        <div class="stat"><b id="sEaten">0</b><span>Eaten</span></div>
        <div class="stat"><b id="sPct">0%</b><span>Used</span></div>
      </div>
    </div>

    <div class="glass card">
      <h2>Macros</h2>
      <div id="macros"></div>
    </div>

    <div class="glass card">
      <h2>Next move</h2>
      <div class="quip"><div class="spark">✨</div><div id="quip"></div></div>
    </div>

    <div class="glass card">
      <h2>Today's log</h2>
      <div id="meals"></div>
    </div>
  </section>

  <section class="page" id="p-week">
    <div class="glass card">
      <h2>This week</h2>
      <div class="week" id="week"></div>
      <div class="week-avg" id="weekAvg"></div>
    </div>
    <div class="glass card">
      <h2>Weekly macros (avg / day)</h2>
      <div id="weekMacros"></div>
    </div>
  </section>

  <section class="page" id="p-month">
    <div class="glass card">
      <div class="cal-head">
        <h2 id="monthName"></h2>
        <div class="legend"><span><i style="background:var(--good)"></i>Under</span><span><i style="background:var(--over)"></i>Over</span></div>
      </div>
      <div class="grid" id="cal"></div>
    </div>
  </section>
  <div class="note" id="srcNote"></div>
</div>

<nav>
  <button class="on" data-p="today">Today</button>
  <button data-p="week">Week</button>
  <button data-p="month">Month</button>
</nav>

<script>
/* ============ CONFIG ============ */
const SHEET_ID = "1wNvK2IBvlL6v5w8CYlVqCT0GGs00Kjtng1LyT8NttSw";
const GOALS = { cal: 1850, pro: 175, carb: 185, fat: 45 };
const MACRO_META = [
  { k: "pro",  label: "Protein", color: "var(--pro)"  },
  { k: "carb", label: "Carbs",   color: "var(--carb)" },
  { k: "fat",  label: "Fat",     color: "var(--fat)"  },
];
const WEEK_BAR_H = 118;   /* px of bar area inside the week chart */
const WEEK_LBL_H = 22;    /* px reserved for the day labels */

/* Preview data (your real entries so far). Live sheet data replaces this when reachable. */
let ROWS = [
  ["2026-11-23","8:00","Oatmeal, 1/3 cup dry",100,4,18,2],
  ["2026-11-23","8:00","Blueberries, ~1/4 cup",20,0,5,0],
  ["2026-11-23","11:00","Scrambled eggs, 3 large (with a little cooking fat)",260,19,2,19],
  ["2026-11-23","11:00","Steak slivers, ~2 oz",110,14,0,6],
  ["2026-11-23","13:30","Premier Protein shake, vanilla, 11 oz",160,30,5,3],
  ["2026-11-23","13:30","PB Fit powder, 1 tbsp",25,3,2,1],
];
let LIVE = false;

/* ============ HELPERS ============ */
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString();
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const todayDate = () => new Date();          /* re-read each render so the page survives midnight */
const todayKey  = () => iso(todayDate());

/* Accepts 2026-11-23, 2026-11-3, or 11/23/2026 and returns 2026-11-23 */
function normDate(s) {
  s = String(s || "").trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + "-" + pad(+m[2]) + "-" + pad(+m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return m[3] + "-" + pad(+m[1]) + "-" + pad(+m[2]);
  return s;
}

function parseCSV(text) {
  const out = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i+1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); out.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur || row.length) { row.push(cur); out.push(row); }
  return out;
}

async function loadLive() {
  try {
    /* cache-buster so the browser never serves a stale copy of the sheet */
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Log&_=${Date.now()}`;
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("bad status");
    const rows = parseCSV(await res.text()).slice(1).filter(r => r[0] && r[0].trim());
    if (rows.length) {
      ROWS = rows.map(r => [normDate(r[0]), r[1], r[2], +r[3]||0, +r[4]||0, +r[5]||0, +r[6]||0]);
      LIVE = true;
    }
  } catch (e) { LIVE = false; }
}

function byDay() {
  const m = {};
  ROWS.forEach(r => {
    const d = (m[r[0]] ||= { cal:0, pro:0, carb:0, fat:0, items:[] });
    d.cal += r[3]; d.pro += r[4]; d.carb += r[5]; d.fat += r[6]; d.items.push(r);
  });
  return m;
}

/* One place that sizes every progress bar and week bar. Called after EVERY render,
   so a re-render can never leave a bar stuck at zero. */
function paintBars(animate) {
  const bars = document.querySelectorAll(".bar i, .col .b");
  const apply = () => bars.forEach(el => {
    if (el.dataset.w != null) el.style.width = el.dataset.w + "%";
    if (el.dataset.h != null) el.style.height = el.dataset.h + "px";
  });
  if (animate) { void document.body.offsetHeight; requestAnimationFrame(() => requestAnimationFrame(apply)); }
  else {
    bars.forEach(el => el.style.transition = "none");
    apply();
    void document.body.offsetHeight;
    bars.forEach(el => el.style.transition = "");
  }
}

/* ============ RENDER ============ */
function renderToday(days, animate) {
  const d = days[todayKey()] || { cal:0, pro:0, carb:0, fat:0, items:[] };
  const left = GOALS.cal - d.cal;
  const pct = Math.min(d.cal / GOALS.cal, 1);
  const C = 2 * Math.PI * 82;
  const prog = $("prog");
  prog.style.strokeDasharray = C;
  prog.style.stroke = left < 0 ? "#ff453a" : "";
  if (animate) { prog.style.transition = "none"; prog.style.strokeDashoffset = C; void prog.getBoundingClientRect(); prog.style.transition = ""; }
  requestAnimationFrame(() => prog.style.strokeDashoffset = C * (1 - pct));

  $("left").textContent = fmt(Math.abs(left));
  $("leftLbl").textContent = left >= 0 ? "calories left" : "calories over";
  $("eaten").textContent = fmt(d.cal) + " of " + fmt(GOALS.cal);
  $("sGoal").textContent = fmt(GOALS.cal);
  $("sEaten").textContent = fmt(d.cal);
  $("sPct").textContent = Math.round(d.cal / GOALS.cal * 100) + "%";

  $("macros").innerHTML = MACRO_META.map(m => {
    const v = d[m.k], g = GOALS[m.k];
    return `<div class="macro">
      <div class="row"><span>${m.label}</span><span>${fmt(v)}g / ${g}g</span></div>
      <div class="bar"><i data-w="${Math.min(v/g,1)*100}" style="background:linear-gradient(90deg, ${m.color}, rgba(255,255,255,.75)); box-shadow:0 0 12px ${m.color}"></i></div>
    </div>`;
  }).join("");

  $("quip").textContent = makeQuip(d, left);

  $("meals").innerHTML = d.items.length ? d.items.map(r =>
    `<div class="meal"><div><div class="n">${r[2]}</div><div class="t">${r[1]} · P${r[4]} C${r[5]} F${r[6]}</div></div><div class="k">${r[3]}</div></div>`
  ).join("") : `<div class="quip">Nothing logged yet. Tell Claude what you ate.</div>`;
}

function makeQuip(d, left) {
  const pLeft = GOALS.pro - d.pro, fLeft = GOALS.fat - d.fat;
  const hr = new Date().getHours();
  if (left < 0) return `You're ${fmt(-left)} over. Not a crisis. Keep the rest of the day light and let the week average do the work.`;
  if (d.cal === 0) return "Clean slate. Lead with protein to set the tone.";
  if (fLeft < 15 && left > 300) return `Fat is nearly spent (${Math.max(fLeft,0)}g left) but you have ${fmt(left)} calories. Think grilled chicken or white fish with rice and veggies.`;
  if (pLeft > 60 && hr >= 16) return `${fmt(pLeft)}g protein still to go. Chicken breast, shrimp or Greek yogurt will get you there.`;
  if (pLeft <= 0) return "Protein goal hit. Fill the rest with carbs and veg, and keep fats light.";
  return `${fmt(left)} calories and ${fmt(pLeft)}g protein left. A lean protein plus carbs and veggies fits perfectly.`;
}

function renderWeek(days) {
  const now = todayDate(), TODAY = iso(now);
  const start = new Date(now); start.setDate(now.getDate() - ((now.getDay() + 6) % 7)); /* Monday */
  const names = ["M","T","W","T","F","S","S"];
  const weekKeys = [...Array(7)].map((_, i) => { const dt = new Date(start); dt.setDate(start.getDate() + i); return iso(dt); });
  const max = Math.max(GOALS.cal * 1.25, ...weekKeys.map(k => (days[k] ? days[k].cal : 0)));

  let sum = 0, n = 0, ps = 0, cs = 0, fs = 0;
  const cols = weekKeys.map((k, i) => {
    const v = days[k], cal = v ? v.cal : 0;
    if (v) { sum += cal; n++; ps += v.pro; cs += v.carb; fs += v.fat; }
    const h = Math.max(cal / max * WEEK_BAR_H, v ? 4 : 0);
    const color = !v ? "rgba(255,255,255,.12)" : cal > GOALS.cal ? "linear-gradient(#ff8a80,#ff453a)" : "linear-gradient(#7dffa3,#30d158)";
    return `<div class="col"><div class="b" data-h="${v ? h : 4}" style="background:${color}"></div><div class="lbl ${k===TODAY?'today':''}">${names[i]}</div></div>`;
  });
  const goalBottom = WEEK_LBL_H + GOALS.cal / max * WEEK_BAR_H;
  $("week").innerHTML = `<div class="goal-line" style="bottom:${goalBottom}px"><em>Goal ${fmt(GOALS.cal)}</em></div>` + cols.join("");

  $("weekAvg").innerHTML = n ? `Average <b>${fmt(sum/n)}</b> cal/day over ${n} logged day${n>1?"s":""}` : "No days logged yet this week.";

  $("weekMacros").innerHTML = n ? MACRO_META.map((m, i) => {
    const avg = [ps, cs, fs][i] / n;
    return `<div class="macro"><div class="row"><span>${m.label}</span><span>${fmt(avg)}g / ${GOALS[m.k]}g</span></div>
      <div class="bar"><i data-w="${Math.min(avg/GOALS[m.k],1)*100}" style="background:linear-gradient(90deg, ${m.color}, rgba(255,255,255,.75))"></i></div></div>`;
  }).join("") : `<div class="quip">Log a day to see your weekly averages.</div>`;
}

function renderMonth(days) {
  const now = todayDate(), TODAY = iso(now);
  const y = now.getFullYear(), mo = now.getMonth();
  $("monthName").textContent = now.toLocaleString("en-US", { month: "long", year: "numeric" });
  const first = new Date(y, mo, 1), total = new Date(y, mo + 1, 0).getDate();
  const offset = (first.getDay() + 6) % 7;
  let html = ["M","T","W","T","F","S","S"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < offset; i++) html += `<div></div>`;
  for (let d = 1; d <= total; d++) {
    const k = iso(new Date(y, mo, d)), v = days[k];
    let cls = "day";
    if (v) cls += v.cal > GOALS.cal ? " over" : " under";
    if (k === TODAY) cls += " today";
    if (k > TODAY) cls += " future";
    html += `<div class="${cls}">${d}</div>`;
  }
  $("cal").innerHTML = html;
}

/* Re-render everything, then size all bars in one pass */
function renderAll(animate) {
  const days = byDay();
  $("dateLabel").textContent = todayDate().toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
  renderToday(days, animate);
  renderWeek(days);
  renderMonth(days);
  paintBars(animate);
  $("srcNote").textContent = LIVE ? "Live from your Nutrition Log sheet" : "Showing preview data. Share the sheet (anyone with link can view) to go live.";
}

/* ============ INIT ============ */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("on"));
  document.querySelectorAll(".page").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  $("p-" + b.dataset.p).classList.add("on");
  paintBars(true);   /* bars on the newly visible tab animate in */
});

(async function init() {
  renderAll(true);                 /* instant paint with preview data */
  await loadLive();
  renderAll(false);                /* swap in live data without flicker */
  setInterval(async () => { await loadLive(); renderAll(false); }, 60000);
  document.addEventListener("visibilitychange", async () => {
    if (!document.hidden) { await loadLive(); renderAll(false); }   /* refresh when you come back to the tab */
  });
})();
</script>
</body>
</html>
